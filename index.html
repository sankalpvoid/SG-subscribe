<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream CTA — Like, Subscribe, Share</title>
<style>
  :root {
    --gold: #C5A866;
    --gold-light: #F0DCA4;
    --ink: #11141B;
    --muted: #B9BBC2;
    --red: #D92836;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: transparent;
  }
  body {
    display: grid; place-items: center;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stage {
    width: 300px; height: 100px; display: grid; place-items: center;
    position: relative; opacity: 0; visibility: hidden;
  }
  .stage.visible {
    visibility: visible;
    animation: enter .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .capsule {
    width: 280px; height: 72px; position: relative; overflow: hidden;
    display: flex; align-items: center;
    border-radius: 999px;
    border: 1px solid rgba(197,168,102,.88);
    background: linear-gradient(105deg, #11141B 0%, #1C1F26 49%, #11141B 100%);
    box-shadow: 0 12px 34px rgba(0,0,0,.28), 0 0 0 5px rgba(197,168,102,.055), inset 0 1px 0 rgba(255,255,255,.055);
  }
  .capsule:before {
    content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,220,164,.6), transparent);
  }
  .capsule:after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(90deg, rgba(197,168,102,.055), transparent 30%, transparent 70%, rgba(197,168,102,.055));
  }
  .action {
    width: 100%; min-width: 0; height: 100%; display: flex; align-items: center;
    position: relative; z-index: 1;
  }
  .step {
    position: absolute; inset: 0; padding: 0 22px;
    display: flex; align-items: center; gap: 12px;
    opacity: 0; transform: translateY(7px);
  }
  .visible .step.like { animation: none; opacity: 1; transform: none; }
  .visible .step.subscribe { animation: reveal 2.45s ease 2.25s both; }
  .visible .step.share { animation: reveal 2.6s ease 4.5s both; }
  .icon {
    width: 36px; height: 36px; flex: 0 0 36px;
    display: grid; place-items: center; border-radius: 50%;
    background: rgba(197,168,102,.10); border: 1px solid rgba(197,168,102,.45);
  }
  .icon svg { width: 20px; height: 20px; overflow: visible; }
  .subscribe .icon { background: var(--red); border-color: rgba(255,255,255,.12); box-shadow: 0 0 20px rgba(217,40,54,.18); }
  .copy { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .label {
    color: #F8F7F2; font-size: 14px; line-height: 1.1; font-weight: 800;
    letter-spacing: 1.2px; white-space: nowrap;
  }
  .subline {
    color: var(--muted); font-size: 8px; line-height: 1.2; font-weight: 600;
    letter-spacing: 1.1px; text-transform: uppercase; white-space: nowrap;
  }
  .end-cap {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold-light);
    box-shadow: 0 0 10px rgba(240,220,164,.65); z-index: 2;
  }
  .glint {
    position: absolute; top: -30%; left: -20%; width: 42px; height: 160%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.075), transparent);
    transform: rotate(18deg); opacity: 0;
    pointer-events: none; z-index: 2;
  }
  .visible .glint { animation: glint 4.8s ease-in-out 1s 1 both; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes reveal {
    0% { opacity: 0; transform: translateY(7px); }
    12%, 78% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-5px); }
  }
  @keyframes glint { 0%, 18% { left: -20%; opacity: 0; } 28% { opacity: 1; } 50%, 100% { left: 115%; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .visible, .visible .step, .visible .glint { animation: none !important; }
    .visible .step.like { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Like, subscribe, and share call to action">
    <section class="capsule">
      <div class="action">
        <div class="step like">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.2 10.2 12 3.4c.8-1.4 2.8-.7 2.6.9l-.8 4.6h5.1c1.8 0 2.8 1.6 2.2 3.2l-2.3 6.5a2.8 2.8 0 0 1-2.6 1.8H8.2V10.2Z" fill="#C5A866" stroke="#F0DCA4" stroke-width="1.1" stroke-linejoin="round"/><path d="M3.8 10h3.4v10H3.8a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z" fill="#F0DCA4"/></svg></div>
          <div class="copy"><div class="label">LIKE</div><div class="subline">Support the stream</div></div>
        </div>
        <div class="step subscribe">
          <div class="icon"><svg viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M8.8 5.6c0-.9 1-1.4 1.8-.9l8.1 5.4a1.1 1.1 0 0 1 0 1.8l-8.1 5.4c-.8.5-1.8 0-1.8-.9V5.6Z"/></svg></div>
          <div class="copy"><div class="label">SUBSCRIBE</div><div class="subline">Join the community</div></div>
        </div>
        <div class="step share">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="18" cy="5" r="2.5" fill="#F0DCA4" stroke="#C5A866" stroke-width="1.2"/><circle cx="6" cy="12" r="2.5" fill="#F0DCA4" stroke="#C5A866" stroke-width="1.2"/><circle cx="18" cy="19" r="2.5" fill="#F0DCA4" stroke="#C5A866" stroke-width="1.2"/><path d="m8.3 10.8 7.4-4.5M8.3 13.2l7.4 4.5" stroke="#F0DCA4" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div class="copy"><div class="label">SHARE</div><div class="subline">Pass it along</div></div>
        </div>
      </div>
      <div class="end-cap"></div><div class="glint"></div>
    </section>
  </main>
  <script>
    (() => {
      const stage = document.querySelector('.stage');
      const POSITIONING_DURATION_MS = 60 * 1000;

      // Temporary OBS positioning mode: show the LIKE state immediately
      // and keep it still for one minute, then hide it.
      stage.classList.add('visible');
      window.setTimeout(() => stage.classList.remove('visible'), POSITIONING_DURATION_MS);
    })();
  </script>
</body>
</html>
