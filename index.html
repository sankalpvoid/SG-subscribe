<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WealthWithSG — Like, Subscribe & Bell</title>
<style>
  :root { --gold:#C5A866; --gold-light:#F0DCA4; --ink:#11141B; --red:#D92836; }
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
  body { display:grid; place-items:center; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .stage { width:280px; height:280px; position:relative; display:grid; place-items:center; animation: entrance .7s cubic-bezier(.2,.8,.2,1) both, exit .7s ease-in 8.8s forwards; }
  .halo { position:absolute; inset:14px; border-radius:50%; background:radial-gradient(circle,rgba(197,168,102,.18),rgba(197,168,102,.04) 55%,transparent 72%); animation: breathe 2.6s ease-in-out infinite; }
  .orbit { position:absolute; inset:18px; border-radius:50%; border:1px solid rgba(197,168,102,.44); box-shadow:0 0 28px rgba(197,168,102,.1),inset 0 0 18px rgba(197,168,102,.05); }
  .orbit:before,.orbit:after { content:""; position:absolute; width:5px;height:5px;border-radius:50%;background:var(--gold-light);box-shadow:0 0 10px var(--gold); }
  .orbit:before { top:24px;right:35px; } .orbit:after { bottom:30px;left:24px;opacity:.65; }
  .medallion { width:224px;height:224px;border-radius:50%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;background:radial-gradient(circle at 50% 18%,#292b30 0%,#191b21 48%,#101217 100%);border:1.5px solid var(--gold);box-shadow:0 12px 35px rgba(0,0,0,.24),0 0 0 5px rgba(197,168,102,.07),inset 0 0 25px rgba(197,168,102,.07); }
  .brand { position:absolute;top:25px;left:0;right:0;font-size:10px;letter-spacing:2.8px;font-weight:750;color:var(--gold-light);text-transform:uppercase;white-space:nowrap; }
  .rule { position:absolute;top:45px;width:43px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .content { position:absolute;top:65px;left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:10px; }
  .icon { width:46px;height:46px;display:grid;place-items:center; }
  .icon svg { width:40px;height:40px;overflow:visible; }
  .label { color:#fff;font-size:17px;font-weight:800;letter-spacing:1.4px;line-height:1.1; }
  .subline { color:#C5C7CC;font-size:9px;font-weight:550;letter-spacing:1.4px;text-transform:uppercase; }
  .step { position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;opacity:0; }
  .step.like { animation: show 2.35s ease 0s both; }
  .step.subscribe { animation: show 2.5s ease 2.15s both; }
  .step.bell { animation: show 2.6s ease 4.45s both; }
  .step .icon { width:48px;height:48px; }
  .step .label { font-size:16px; }
  .step .subline { font-size:8px; }
  .icon-circle { width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:var(--red);box-shadow:0 0 20px rgba(217,40,54,.24); }
  .icon-circle svg { width:23px;height:23px; }
  .like .icon svg { filter:drop-shadow(0 0 8px rgba(197,168,102,.2)); }
  .bell .icon svg { filter:drop-shadow(0 0 8px rgba(197,168,102,.25)); }
  .spark { position:absolute;width:3px;height:3px;background:var(--gold-light);border-radius:50%;animation:twinkle 1.8s ease-in-out infinite; }
  .s1{top:54px;left:49px}.s2{right:43px;top:91px;animation-delay:.6s}.s3{bottom:54px;right:55px;animation-delay:1.1s}.s4{bottom:77px;left:42px;animation-delay:.3s}
  @keyframes entrance { from{opacity:0;transform:scale(.76)} to{opacity:1;transform:scale(1)} }
  @keyframes exit { to{opacity:0;transform:scale(.92);visibility:hidden} }
  @keyframes show { 0%{opacity:0;transform:translateY(8px) scale(.94)} 12%,78%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-5px) scale(1.02)} }
  @keyframes breathe { 0%,100%{transform:scale(.98);opacity:.6} 50%{transform:scale(1.04);opacity:1} }
  @keyframes twinkle { 0%,100%{opacity:.25;transform:scale(.7)} 50%{opacity:1;transform:scale(1.5)} }
  @media (prefers-reduced-motion: reduce) { .stage,.halo,.step,.spark { animation:none!important; } .step.like{opacity:1} }
</style>
</head>
<body>
  <main class="stage" aria-label="WealthWithSG like, subscribe and notifications animation">
    <div class="halo"></div><div class="orbit"></div>
    <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
    <section class="medallion">
      <div class="brand">WEALTHWITHSG</div><div class="rule"></div>
      <div class="content">
        <div class="step like">
          <div class="icon"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M17 21.5 24 9c1.3-2.4 4.7-1.2 4.3 1.5L27 19h9.2c3 0 4.8 2.7 3.8 5.4l-4.1 11.1a4.7 4.7 0 0 1-4.4 3H17V21.5Z" fill="#C5A866" stroke="#F0DCA4" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 21h7v17H8a2 2 0 0 1-2-2V23a2 2 0 0 1 2-2Z" fill="#F0DCA4"/></svg></div>
          <div class="label">LIKE THE STREAM</div><div class="subline">Support the channel</div>
        </div>
        <div class="step subscribe">
          <div class="icon"><div class="icon-circle"><svg viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M9 5.8c0-.8.9-1.3 1.6-.9l8 5.2a1.1 1.1 0 0 1 0 1.8l-8 5.2c-.7.5-1.6 0-1.6-.9V5.8Z"/></svg></div></div>
          <div class="label">SUBSCRIBE</div><div class="subline">Join WealthWithSG</div>
        </div>
        <div class="step bell">
          <div class="icon"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 7a2.5 2.5 0 0 1 2.5 2.5v1.2c5.1 1.2 8.5 5.5 8.5 11v6.1c0 2.3 1 4.2 3 5.7H10c2-1.5 3-3.4 3-5.7v-6.1c0-5.5 3.4-9.8 8.5-11V9.5A2.5 2.5 0 0 1 24 7Z" fill="#C5A866" stroke="#F0DCA4" stroke-width="1.5" stroke-linejoin="round"/><path d="M19 36a5.2 5.2 0 0 0 10 0" stroke="#F0DCA4" stroke-width="2.2" stroke-linecap="round"/><path d="M37 10l3-3M39 17h4M11 10 8 7M9 17H5" stroke="#F0DCA4" stroke-width="1.8" stroke-linecap="round"/></svg></div>
          <div class="label">TURN ON THE BELL</div><div class="subline">Never miss a live stream</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
