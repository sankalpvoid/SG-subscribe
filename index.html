<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WealthWithSG — Stream CTA</title>
<style>
  :root {
    --gold: #C5A866;
    --gold-light: #F0DCA4;
    --ink: #11141B;
    --muted: #B9BBC2;
    --red: #D92836;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: transparent;
  }
  body {
    display: grid; place-items: center;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stage {
    width: 620px; height: 160px; display: grid; place-items: center;
    position: relative;
    animation: enter .55s cubic-bezier(.2,.8,.2,1) both, leave .5s ease-in 8.8s forwards;
  }
  .capsule {
    width: 584px; height: 104px; position: relative; overflow: hidden;
    display: flex; align-items: center;
    border-radius: 999px;
    border: 1px solid rgba(197,168,102,.88);
    background: linear-gradient(105deg, #11141B 0%, #1C1F26 49%, #11141B 100%);
    box-shadow: 0 12px 34px rgba(0,0,0,.28), 0 0 0 5px rgba(197,168,102,.055), inset 0 1px 0 rgba(255,255,255,.055);
  }
  .capsule:before {
    content: ""; position: absolute; left: 34px; right: 34px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,220,164,.6), transparent);
  }
  .capsule:after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(90deg, rgba(197,168,102,.055), transparent 30%, transparent 70%, rgba(197,168,102,.055));
  }
  .brand {
    width: 184px; flex: 0 0 184px; padding-left: 28px;
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    position: relative; z-index: 1;
  }
  .brand-kicker {
    font-size: 9px; line-height: 1; letter-spacing: 2.6px; font-weight: 800;
    color: var(--gold); text-transform: uppercase; white-space: nowrap;
  }
  .brand-name {
    font-size: 17px; line-height: 1.15; letter-spacing: -.35px; font-weight: 750;
    color: #F6F4EE; white-space: nowrap;
  }
  .divider {
    width: 1px; height: 43px; flex: 0 0 1px; position: relative; z-index: 1;
    background: linear-gradient(transparent, rgba(197,168,102,.68), transparent);
  }
  .action {
    min-width: 0; flex: 1; height: 100%; display: flex; align-items: center;
    gap: 16px; padding: 0 27px; position: relative; z-index: 1;
  }
  .step {
    position: absolute; inset: 0; padding: 0 25px;
    display: flex; align-items: center; gap: 15px;
    opacity: 0; transform: translateY(7px);
  }
  .step.like { animation: reveal 2.45s ease 0s both; }
  .step.subscribe { animation: reveal 2.45s ease 2.25s both; }
  .step.bell { animation: reveal 2.6s ease 4.5s both; }
  .icon {
    width: 44px; height: 44px; flex: 0 0 44px;
    display: grid; place-items: center; border-radius: 50%;
    background: rgba(197,168,102,.10); border: 1px solid rgba(197,168,102,.45);
  }
  .icon svg { width: 24px; height: 24px; overflow: visible; }
  .subscribe .icon { background: var(--red); border-color: rgba(255,255,255,.12); box-shadow: 0 0 20px rgba(217,40,54,.18); }
  .copy { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .label {
    color: #F8F7F2; font-size: 16px; line-height: 1.1; font-weight: 800;
    letter-spacing: 1.2px; white-space: nowrap;
  }
  .subline {
    color: var(--muted); font-size: 9px; line-height: 1.2; font-weight: 600;
    letter-spacing: 1.8px; text-transform: uppercase; white-space: nowrap;
  }
  .end-cap {
    position: absolute; right: 17px; top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold-light);
    box-shadow: 0 0 10px rgba(240,220,164,.65); z-index: 2;
  }
  .glint {
    position: absolute; top: -30%; left: -20%; width: 70px; height: 160%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.075), transparent);
    transform: rotate(18deg); animation: glint 4.8s ease-in-out 1s infinite;
    pointer-events: none; z-index: 2;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes leave { to { opacity: 0; transform: translateY(-4px) scale(.99); visibility: hidden; } }
  @keyframes reveal {
    0% { opacity: 0; transform: translateY(7px); }
    12%, 78% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-5px); }
  }
  @keyframes glint { 0%, 18% { left: -20%; opacity: 0; } 28% { opacity: 1; } 50%, 100% { left: 115%; opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .stage, .step, .glint { animation: none !important; }
    .step.like { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="WealthWithSG stream call to action">
    <section class="capsule">
      <div class="brand">
        <div class="brand-kicker">Market insights • Live</div>
        <div class="brand-name">WEALTHWITHSG</div>
      </div>
      <div class="divider"></div>
      <div class="action">
        <div class="step like">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8.2 10.2 12 3.4c.8-1.4 2.8-.7 2.6.9l-.8 4.6h5.1c1.8 0 2.8 1.6 2.2 3.2l-2.3 6.5a2.8 2.8 0 0 1-2.6 1.8H8.2V10.2Z" fill="#C5A866" stroke="#F0DCA4" stroke-width="1.1" stroke-linejoin="round"/><path d="M3.8 10h3.4v10H3.8a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z" fill="#F0DCA4"/></svg></div>
          <div class="copy"><div class="label">LIKE THE STREAM</div><div class="subline">Support the channel</div></div>
        </div>
        <div class="step subscribe">
          <div class="icon"><svg viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M8.8 5.6c0-.9 1-1.4 1.8-.9l8.1 5.4a1.1 1.1 0 0 1 0 1.8l-8.1 5.4c-.8.5-1.8 0-1.8-.9V5.6Z"/></svg></div>
          <div class="copy"><div class="label">SUBSCRIBE</div><div class="subline">Join WealthWithSG</div></div>
        </div>
        <div class="step bell">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5a1.4 1.4 0 0 1 1.4 1.4v.7c2.9.7 4.8 3.1 4.8 6.2v3.4c0 1.3.6 2.4 1.7 3.2H4.1c1.1-.8 1.7-1.9 1.7-3.2v-3.4c0-3.1 1.9-5.5 4.8-6.2v-.7A1.4 1.4 0 0 1 12 3.5Z" fill="#C5A866" stroke="#F0DCA4" stroke-width="1.1" stroke-linejoin="round"/><path d="M9.2 20a3 3 0 0 0 5.6 0M19.2 6.5l1.4-1.4M20 10h2M4.8 6.5 3.4 5.1M4 10H2" stroke="#F0DCA4" stroke-width="1.2" stroke-linecap="round"/></svg></div>
          <div class="copy"><div class="label">TURN ON THE BELL</div><div class="subline">Never miss a live stream</div></div>
        </div>
      </div>
      <div class="end-cap"></div><div class="glint"></div>
    </section>
  </main>
</body>
</html>
